<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>打工人：活下去</title>
  <style>
    :root {
      --text: #e8e6dc;
      --muted: #8b9288;
      --accent: #e6c36a;
      --danger: #d36a6a;
      --ok: #7dba86;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0a0c10; color: var(--text); font-family: "PingFang SC", "Noto Sans SC", sans-serif; overflow: hidden; }
    body { display: flex; justify-content: center; }
    #app { width: 100%; max-width: 430px; height: 100%; position: relative; overflow: hidden; }
    button { font-family: inherit; }
    .back { background: none; border: 0; color: var(--muted); padding: 0; cursor: pointer; }
    input { width: 100%; background: #1c212b; color: var(--text); border: 1px solid #333; border-radius: 8px; padding: 10px; }

    .fp { position: absolute; inset: 0; background: #141820; }
    .fp-cam {
      position: absolute; inset: 0;
      transform-origin: 50% 58%;
      will-change: transform;
    }
    .fp-breathe {
      position: absolute; inset: 0;
      animation: breathe 4.5s ease-in-out infinite;
    }
    .ceiling {
      position: absolute; left: -10%; right: -10%; top: 0; height: 22%;
      background: linear-gradient(#2a3140, #1c232e);
      clip-path: polygon(8% 100%, 92% 100%, 100% 0, 0 0);
    }
    .lamp {
      position: absolute; left: 28%; top: 2%; width: 44%; height: 14px;
      background: #f3e2a8; border-radius: 0 0 8px 8px; opacity: .55;
      box-shadow: 0 40px 80px 30px rgba(243, 226, 168, .16);
      animation: flicker 6s ease-in-out infinite;
    }
    .wall-l, .wall-r {
      position: absolute; top: 12%; bottom: 28%; width: 18%;
      background: #3d4a5c;
    }
    .wall-l { left: 0; clip-path: polygon(0 0, 100% 8%, 100% 100%, 0 100%); box-shadow: inset -18px 0 24px rgba(0,0,0,.25); }
    .wall-r { right: 0; clip-path: polygon(0 8%, 100% 0, 100% 100%, 0 100%); box-shadow: inset 18px 0 24px rgba(0,0,0,.25); }
    .window {
      position: absolute; right: 3%; top: 16%; width: 13%; height: 18%;
      background: #0b1020; border: 3px solid #4a5568; overflow: hidden;
    }
    .city {
      position: absolute; left: 4px; bottom: 6px; width: 6px; height: 14px; background: #24304a;
      box-shadow: 10px 4px 0 #1c2740, 18px 0 0 #2a3654, 4px -8px 0 1px #e6c36a, 14px -4px 0 1px #7dba86;
      animation: city 5s linear infinite;
    }
    .pin {
      position: absolute; left: 5%; top: 20%; width: 44px; height: 36px;
      background: #efe7c8; color: #5a4a32; font-size: 9px; padding: 6px 5px;
      transform: rotate(-8deg); box-shadow: 0 2px 0 #c9b98a;
    }

    .desk {
      position: absolute; left: -5%; right: -5%; bottom: 0; height: 42%;
      background: linear-gradient(#4a3428, #2f211b);
      clip-path: polygon(0 100%, 0 38%, 50% 8%, 100% 38%, 100% 100%);
      box-shadow: inset 0 18px 30px rgba(0,0,0,.35);
    }
    .bezel {
      position: absolute; left: 11%; right: 11%; top: 17%; height: 49%;
      background: #16181e; border-radius: 10px 10px 6px 6px;
      box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 40px rgba(90, 160, 220, .08);
      transform: perspective(700px) rotateX(6deg);
      overflow: hidden;
      z-index: 3;
    }
    .bezel::after {
      content: ""; position: absolute; left: 46%; bottom: -10px; width: 8%; height: 10px; background: #16181e;
    }
    .chrome {
      height: 26px; background: #23262e; display: flex; align-items: center; gap: 6px; padding: 0 10px;
      color: #9aa; font-size: 11px; letter-spacing: .4px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d36a6a; }
    .dot:nth-child(2) { background: #e6c36a; }
    .dot:nth-child(3) { background: #7dba86; }
    .lcd {
      position: absolute; inset: 26px 8px 10px; background: #0c1118;
      overflow: auto; padding: 12px 12px 16px;
      box-shadow: inset 0 0 40px rgba(80,140,200,.08);
    }
    .lcd::-webkit-scrollbar { width: 0; }

    .kb {
      position: absolute; left: 18%; right: 18%; bottom: 16%; height: 9%;
      background: #1a1d24; border-radius: 6px; transform: perspective(500px) rotateX(55deg);
      z-index: 4; box-shadow: 0 8px 0 #0e1014;
    }
    .kb i {
      position: absolute; top: 18%; width: 7%; height: 38%; background: #2b303a; border-radius: 2px;
    }
    .mouse {
      position: absolute; right: 16%; bottom: 18%; width: 22px; height: 34px;
      background: #1e222a; border-radius: 10px 10px 14px 14px; z-index: 4;
      transform: perspective(300px) rotateX(40deg);
    }
    .mug {
      position: absolute; right: 7%; bottom: 28%; width: 22px; height: 26px;
      background: #8b3a3a; border-radius: 0 0 6px 6px; z-index: 4;
    }
    .mug .steam, .mug .steam::before, .mug .steam::after {
      content: ""; position: absolute; width: 3px; height: 12px; border-radius: 50%;
      background: rgba(255,255,255,.28); animation: steam 2.4s ease-in-out infinite;
    }
    .mug .steam { left: 8px; top: -14px; }
    .mug .steam::before { left: -5px; animation-delay: .3s; }
    .mug .steam::after { left: 5px; animation-delay: .7s; }

    .arm {
      position: absolute; bottom: -6%; width: 42%; height: 26%; z-index: 6; pointer-events: none;
      background: linear-gradient(#4a6a90, #2d4666); border-radius: 40% 40% 0 0;
    }
    .arm.l { left: -6%; transform: rotate(16deg); transform-origin: bottom left; }
    .arm.r { right: -6%; transform: rotate(-16deg); transform-origin: bottom right; }
    .hand {
      position: absolute; top: -18px; width: 54px; height: 36px;
      background: #e2b48a; border-radius: 16px 16px 20px 12px;
    }
    .arm.l .hand { right: 10px; animation: typeL .32s ease-in-out infinite; }
    .arm.r .hand { left: 10px; animation: typeR .32s ease-in-out infinite reverse; }
    .finger {
      position: absolute; top: -10px; width: 8px; height: 16px; background: #e2b48a; border-radius: 4px;
    }

    .vignette {
      position: absolute; inset: 0; z-index: 7; pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(0,0,0,.55) 100%);
    }
    .grain {
      position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: .05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence baseFrequency='.9' /></filter><rect width='80' height='80' filter='url(%23n)'/></svg>");
    }
    .lids {
      position: absolute; inset: 0; z-index: 9; pointer-events: none;
    }
    .lids::before, .lids::after {
      content: ""; position: absolute; left: 0; right: 0; height: 50%; background: #050608;
      animation: blink 8s ease-in-out infinite;
    }
    .lids::before { top: 0; transform-origin: top; }
    .lids::after { bottom: 0; transform-origin: bottom; }

    .hud {
      position: absolute; left: 10%; right: 10%; top: 10.5%; z-index: 5;
      font-size: 10px; color: #c8c3b4;
      text-shadow: 0 1px 2px #000; pointer-events: none;
    }
    .hud-row { display: flex; justify-content: space-between; gap: 6px; }
    .hud-bars { margin-top: 4px; display: flex; gap: 6px; }
    .hud-bar { flex: 1; height: 4px; background: rgba(0,0,0,.35); border-radius: 3px; overflow: hidden; }
    .hud-bar i { display: block; height: 100%; }
    .hud-bar.hp i { background: #7dba86; }
    .hud-bar.mind i { background: #e6c36a; }
    .hud-bar.low i { background: #d36a6a; }
    .badges { margin-top: 3px; color: var(--accent); letter-spacing: 2px; font-size: 11px; }
    .opt-lock { opacity: .55; }
    .toast {
      position: absolute; left: 10%; right: 10%; top: 22%; z-index: 30; pointer-events: none;
      background: rgba(12, 16, 24, .94); border: 1px solid #2c3544; border-radius: 12px;
      padding: 10px 12px; font-size: 13px; color: var(--text);
      animation: toastIn .25s ease, toastOut .4s ease 1.6s forwards;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }
    .dock {
      position: absolute; right: 8px; bottom: 26%; z-index: 20;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dock button {
      width: 52px; height: 52px; border-radius: 14px; cursor: pointer;
      border: 1px solid #3a4454; background: rgba(18, 22, 30, .92);
      color: var(--text); font-size: 13px;
    }
    .dock button.on { border-color: var(--accent); color: var(--accent); }
    .dock button small { display: block; font-size: 9px; color: var(--muted); }
    .chat-log {
      max-height: 38vh; overflow: auto; margin: 8px 0 10px; padding-right: 4px;
    }
    .chat-line { margin: 0 0 8px; max-width: 86%; }
    .chat-line.me { margin-left: auto; }
    .chat-line .bubble-txt {
      display: inline-block; padding: 8px 10px; border-radius: 10px; font-size: 15px; line-height: 1.4;
    }
    .chat-line.her .bubble-txt { background: #243044; color: var(--text); }
    .chat-line.me .bubble-txt { background: #3d5344; color: #e8f0e6; }
    .chat-send { display: flex; gap: 8px; }
    .chat-send input { flex: 1; margin: 0; }
    .asset-stage { position: absolute; inset: 12% 6% 28%; z-index: 5; }
    .car-body {
      position: absolute; left: 12%; right: 12%; bottom: 22%; height: 38%;
      background: #2a5a8a; border-radius: 18px 48px 8px 8px;
      box-shadow: 0 12px 24px rgba(0,0,0,.35);
    }
    .car-body::before {
      content: ""; position: absolute; left: 28%; top: -42%; width: 48%; height: 70%;
      background: #7aa; border-radius: 10px 28px 0 0; opacity: .7;
    }
    .wheel { position: absolute; bottom: 14%; width: 44px; height: 44px; background: #1a1a1a; border-radius: 50%; border: 6px solid #444; }
    .wheel.l { left: 18%; } .wheel.r { right: 18%; }
    .sofa { position: absolute; left: 18%; right: 18%; bottom: 8%; height: 28%; background: #5a4a3a; border-radius: 12px 12px 0 0; }
    .sofa::after { content: ""; position: absolute; left: 8%; right: 8%; top: -18px; height: 22px; background: #6a5644; border-radius: 8px; }
    .plant { position: absolute; right: 10%; bottom: 18%; width: 16px; height: 50px; background: #3d6b5a; border-radius: 8px 8px 2px 2px; }
    .empty-lot { position: absolute; left: 16%; right: 16%; bottom: 24%; height: 20%; border: 2px dashed #445; border-radius: 12px; }
    .fp.commute .desk { height: 16%; opacity: .5; }
    .sky {
      position: absolute; left: 0; right: 0; top: 0; height: 42%; z-index: 1;
      background: linear-gradient(#6aa0c8, #c8d8e8);
    }
    .fp.commute.dusk .sky { background: linear-gradient(#2a1a40, #8a4a3a); }
    .fp.commute.lobby .sky { background: linear-gradient(#2a3140, #1c232e); display: none; }
    .road {
      position: absolute; left: -5%; right: -5%; bottom: 14%; height: 22%; z-index: 2;
      background: #2a2e34;
    }
    .road::after {
      content: ""; position: absolute; left: 0; right: 0; top: 48%; height: 3px;
      background: repeating-linear-gradient(90deg, #e6c36a 0 18px, transparent 18px 36px);
      animation: lanes 1.2s linear infinite;
    }
    .metro-door {
      position: absolute; left: 18%; right: 18%; top: 22%; height: 40%; z-index: 3;
      background: #1a2230; border: 4px solid #4a5568; border-radius: 8px;
    }
    .metro-door::before, .metro-door::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 48%; background: #243044;
      animation: doors 2.8s ease-in-out infinite;
    }
    .metro-door::before { left: 0; }
    .metro-door::after { right: 0; }
    .ebike {
      position: absolute; left: 38%; bottom: 22%; width: 90px; height: 44px; z-index: 4;
      background: #3d6b5a; border-radius: 18px 30px 8px 8px;
    }
    .ebike::after { content: ""; position: absolute; left: 8px; bottom: -10px; width: 22px; height: 22px; background: #111; border-radius: 50%; box-shadow: 52px 0 0 #111; }
    .gate {
      position: absolute; left: 22%; right: 22%; bottom: 22%; height: 36%; z-index: 3;
      background: #2c3544; border-radius: 6px 6px 0 0;
      box-shadow: inset 0 0 0 8px #1a2028;
    }
    .lift {
      position: absolute; left: 36%; top: 16%; width: 28%; height: 46%; z-index: 3;
      background: #c8c4b8; border: 4px solid #6a7068;
    }
    @keyframes lanes { to { background-position: 36px 0; } }
    @keyframes doors { 0%,40% { transform: none; } 55%,90% { transform: translateX(var(--d, 0)); } }
    .metro-door::before { --d: -70%; }
    .metro-door::after { --d: 70%; }

    .behind {
      position: absolute; left: 50%; top: 8%; width: 70px; height: 90px; margin-left: -35px;
      background: #0a0c10; border-radius: 20px 20px 8px 8px; opacity: 0; z-index: 2;
    }
    .phone-fp {
      position: absolute; right: 8%; bottom: 6%; width: 46%; height: 40%; z-index: 16;
      background: #0d0d0f; border-radius: 18px; border: 3px solid #2c2c32; opacity: 0;
      padding: 10px 8px 28px; color: #eee; font-size: 12px;
      transform: rotate(-8deg) translateY(70%);
      box-shadow: 0 16px 40px rgba(0,0,0,.55);
      pointer-events: none; cursor: pointer;
      transition: transform .45s ease, opacity .35s ease;
    }
    .phone-feed {
      height: 100%; border-radius: 10px; overflow: hidden;
      background: linear-gradient(#223 0%, #412 40%, #1a1a22 100%);
      position: relative;
    }
    .phone-feed::after {
      content: ""; position: absolute; left: 12%; right: 12%; top: 18%; height: 48%;
      background: rgba(255,255,255,.08); border-radius: 8px;
      animation: feed 1.6s ease-in-out infinite;
    }
    .phone-hint {
      position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
      font-size: 11px; color: var(--accent);
    }
    .phone-veil {
      display: none; position: absolute; inset: 0; z-index: 14; cursor: pointer;
    }
    .fp.phone-up .phone-veil { display: block; }
    .fp.phone-up .phone-fp { opacity: 1; transform: rotate(-8deg) translateY(0); pointer-events: auto; }
    .fp.phone-up .lcd { filter: blur(3px) brightness(.48); pointer-events: none; }
    .fp.phone-up .arm.l { transform: rotate(8deg) translate(18px, -36px); }
    .fp.slack .arm.l { transform: rotate(6deg); }
    .fp.panic { animation: panicCam .35s linear infinite; }
    .fp.panic .behind { opacity: .8; animation: loom 1.5s ease-in-out infinite; }
    .fp.panic .lamp { background: #d36a6a; }
    .fp.panic .lcd { box-shadow: inset 0 0 40px rgba(211,106,106,.25); }
    .fp.tired .arm.l .hand, .fp.tired .arm.r .hand { animation-duration: .9s; }
    .fp.money .lcd { box-shadow: inset 0 0 30px rgba(230,195,106,.2); }

    .letterbox { position: absolute; left: 0; right: 0; height: 6%; background: #050608; z-index: 12; pointer-events: none; }
    .letterbox.top { top: 0; }
    .letterbox.bot { display: none; }
    .fp.talk .bezel, .fp.talk .kb, .fp.talk .mouse, .fp.talk .mug, .fp.talk .pin, .fp.talk .phone-fp { display: none; }
    .fp.talk .desk { height: 22%; clip-path: polygon(0 100%, 0 55%, 50% 35%, 100% 55%, 100% 100%); opacity: .9; }
    .fp.talk .arm { height: 22%; opacity: 1; z-index: 12; }
    .fp.talk .hud { top: 7%; z-index: 13; }
    .fp.talk .vignette {
      background: radial-gradient(ellipse at 50% 38%, transparent 36%, rgba(0,0,0,.62) 100%);
    }
    .talk-stage { position: absolute; inset: 6% 0 46%; z-index: 4; }
    .person {
      position: absolute; left: 50%; bottom: -8%; width: 168px; height: 230px; margin-left: -84px;
      transform-origin: 50% 100%; animation: talkBob 2.4s ease-in-out infinite;
    }
    .fp.lean .person { left: 56%; margin-left: 0; }
    .fp.talk.in-face .person {
      width: 210px; height: 280px; margin-left: -105px; bottom: -18%; left: 50%;
      animation: inFace 0.7s ease-in-out infinite;
    }
    .fp.talk.in-face .arm.l { transform: rotate(26deg) translate(8px, -18px); }
    .fp.talk.in-face .arm.r { transform: rotate(-22deg) translate(-6px, -10px); }
    .fp.talk.in-face .arm.l .hand, .fp.talk.in-face .arm.r .hand { animation: fistUp .4s ease-in-out infinite; }
    .fp.call .person { width: 120px; height: 160px; bottom: auto; top: 8%; margin-left: -60px; }
    .fp.phone .person { width: 100px; height: 130px; top: 12%; bottom: auto; }
    .p-hair { position: absolute; left: 38px; top: 8px; width: 84px; height: 44px; background: #2a241c; border-radius: 40px 40px 8px 8px; z-index: 2; }
    .p-head { position: absolute; left: 48px; top: 28px; width: 64px; height: 72px; background: #e4c2a0; border-radius: 50% 50% 46% 46%; z-index: 1; }
    .p-eye { position: absolute; top: 32px; width: 8px; height: 8px; background: #2a241c; border-radius: 50%; }
    .p-eye.l { left: 16px; } .p-eye.r { right: 16px; }
    .p-brow { position: absolute; top: 24px; width: 16px; height: 3px; background: #2a241c; }
    .p-brow.l { left: 12px; transform: rotate(-8deg); } .p-brow.r { right: 12px; transform: rotate(8deg); }
    .p-glasses { display: none; position: absolute; left: 8px; top: 30px; width: 48px; height: 16px; border: 2px solid #333; border-radius: 6px; }
    .p-mouth { position: absolute; left: 24px; bottom: 14px; width: 16px; height: 7px; background: #a45; border-radius: 0 0 10px 10px; animation: speak .28s ease-in-out infinite; }
    .p-neck { position: absolute; left: 70px; top: 92px; width: 20px; height: 18px; background: #d4b08c; }
    .p-body { position: absolute; left: 28px; top: 106px; width: 104px; height: 120px; background: #3d5a80; border-radius: 18px 18px 0 0; }
    .person.boss .p-hair { background: #8a8a8a; height: 28px; top: 18px; }
    .person.boss .p-glasses { display: block; }
    .person.boss .p-body { background: #2c3a4a; }
    .person.boss .p-brow.l { transform: rotate(12deg); } .person.boss .p-brow.r { transform: rotate(-12deg); }
    .person.pm .p-hair { background: #4a3020; }
    .person.pm .p-body { background: #6b4c7a; }
    .person.pm .p-body::after { content: ""; position: absolute; left: 46px; top: 8px; width: 12px; height: 36px; background: #e6c36a; border-radius: 2px; }
    .person.colleague .p-hair { background: #1a1a1a; border-radius: 20px 40px 4px 8px; }
    .person.colleague .p-body { background: #3d6b5a; }
    .person.client .p-hair { background: #3a2a20; }
    .person.client .p-body { background: #1f2a3a; }
    .person.mom .p-hair { background: #5a3a28; height: 52px; }
    .person.mom .p-body { background: #8a5a6a; }
    .person.recruiter .p-hair { background: #2c2018; }
    .person.recruiter .p-body { background: #3a5c7a; }
    .person.recruiter .p-mouth { background: #c66; height: 8px; }
    .person.wife .p-hair { background: #1a1210; height: 58px; left: 32px; width: 96px; border-radius: 40px 40px 12px 18px; }
    .person.wife .p-body { background: #8a4a5a; }
    .person.you .p-hair { background: #3a2818; height: 40px; }
    .person.you .p-body { background: #3d5344; }
    .p-eye i {
      display: block; width: 3px; height: 3px; background: #f2efe8; border-radius: 50%;
      position: absolute; left: 1px; top: 1px;
    }
    .p-lid {
      position: absolute; top: 32px; width: 10px; height: 0; background: #e4c2a0; border-radius: 0;
      animation: blink 3.2s ease infinite; z-index: 2;
    }
    .p-lid.l { left: 15px; } .p-lid.r { right: 15px; }
    .p-blush {
      display: none; position: absolute; top: 46px; width: 10px; height: 6px;
      background: rgba(210, 90, 90, .35); border-radius: 50%;
    }
    .p-blush.l { left: 8px; } .p-blush.r { right: 8px; }
    .p-vein, .p-sweat, .p-spit, .p-tooth, .p-hand { display: none; }
    .p-vein {
      position: absolute; left: 6px; top: 10px; width: 10px; height: 10px; z-index: 3;
      border-left: 2px solid #c44; border-bottom: 2px solid #c44; transform: rotate(18deg);
    }
    .p-sweat {
      position: absolute; right: 4px; top: 8px; width: 6px; height: 10px; background: #9ad;
      border-radius: 40% 40% 50% 50%; z-index: 3; animation: sweatDrop .8s ease-in infinite;
    }
    .p-spit {
      position: absolute; right: -10px; bottom: 16px; width: 18px; height: 8px; z-index: 4;
    }
    .p-spit::before, .p-spit::after {
      content: ""; position: absolute; width: 5px; height: 5px; background: #eee; border-radius: 50%;
      animation: spit 0.35s ease-out infinite;
    }
    .p-spit::after { left: 8px; top: 3px; animation-delay: .12s; }
    .p-tooth {
      position: absolute; left: 3px; top: 1px; width: 10px; height: 3px; background: #f4f0e6; border-radius: 1px;
    }
    .p-hand {
      position: absolute; right: -8px; top: 118px; width: 22px; height: 22px;
      background: #e4c2a0; border-radius: 50%; z-index: 3;
    }
    .person.speaking .p-mouth { animation: speak .22s ease-in-out infinite; }
    .person.mood-smile .p-mouth {
      width: 22px; left: 21px; height: 8px; border-radius: 0 0 14px 14px; background: #a45; animation: none;
    }
    .person.mood-smile .p-brow.l { transform: rotate(-16deg); top: 22px; }

    function typeLine() {
      const el = document.getElementById("spoken");
      if (!el) return;
      const text = state.talkLine || "";
      if (state.typeIv) { clearInterval(state.typeIv); state.typeIv = null; }
      el.textContent = "";
      if (!text) return finishLine();
      let i = 0;
      state.typeIv = setInterval(function () {
        i++;
        el.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(state.typeIv);
          state.typeIv = null;
          finishLine();
        }
      }, 38);
    }

    function bindCam() {
      const cam = document.getElementById("cam");
      if (!cam) return;
      const move = function (x, y) {
        const rx = (x - 0.5) * 8;
        const ry = (y - 0.5) * -5;
        cam.style.transform = "rotateY(" + rx + "deg) rotateX(" + ry + "deg)";
      };
      window.onmousemove = function (e) {
        move(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
      };
      window.ontouchmove = function (e) {
        const t = e.touches[0];
        move(t.clientX / window.innerWidth, t.clientY / window.innerHeight);
      };
    }

    function nextScene() {
      const e = state.game && state.game.event;
      if (!e) return "play";
      if (e.fight) return "fight";
      if (e.minigame) return "boss";
      return "play";
    }
    async function start(careerId) {
      await req("/api/track", "POST", { event: "game_start", payload: { career: careerId } });
      state.game = await req("/api/game/start", "POST", { careerId: careerId, userId: state.userId });
      go(nextScene());
    }
    async function choose(optionId) {
      stopClocks();
      state.settled = state.game && state.game.event ? state.game.event : null;
      state.game = await req("/api/game/" + state.game.gameId + "/choose", "POST", { optionId: optionId });

        state.toast = state.game.flavor || briefDelta(state.game.applied);
        return afterSettle();
      }
      go("settle");

    function briefDelta(applied) {
      if (!applied) return "";
      const parts = [];
      if (applied.money) parts.push("存款 " + sign(applied.money));
      if (applied.hp) parts.push("身体 " + sign(applied.hp));
      if (applied.mind) parts.push("心态 " + sign(applied.mind));
      if (applied.boss) parts.push("老板 " + sign(applied.boss));
      return parts.join(" · ");
    }
    async function minigame(success) {
      state.settled = state.game && state.game.event ? state.game.event : null;
      state.game = await req("/api/game/" + state.game.gameId + "/minigame", "POST", { success: success });
      go("settle");
    }
    function stopClocks() {
      if (state.bossIv) { clearInterval(state.bossIv); state.bossIv = null; }
      if (state.patrolWait) { clearTimeout(state.patrolWait); state.patrolWait = null; }
      if (state.patrolIv) { clearInterval(state.patrolIv); state.patrolIv = null; }
      if (state.typeIv) { clearInterval(state.typeIv); state.typeIv = null; }
    }
    function switchWindow(ok, full) {
      if (state.patrolLock) return;
      state.patrolLock = true;

    async function patrolHit(ok) {
      try {
        const g = await req("/api/game/" + state.game.gameId + "/patrol", "POST", { success: !!ok });
        if (g.attrs) state.game.attrs = g.attrs;
        const overlay = document.getElementById("patrol");
        if (overlay) overlay.className = "patrol gone";
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = g.flavor || (ok ? "切回去了" : "被看见了");
        const root = document.getElementById("app");
        if (root) root.appendChild(toast);
        setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 1800);
      } catch (err) {
        state.patrolLock = false;
      }

    function startBossClock() {
      if (state.bossIv) return;
      state.patrolLock = false;
      let meters = 5;
      state.bossIv = setInterval(function () {
        meters -= 1;
        const dist = document.getElementById("bossDist");
        if (dist) dist.textContent = String(Math.max(0, meters));
        if (meters <= 0) {
          clearInterval(state.bossIv);
          state.bossIv = null;
          if (!state.patrolLock) {
            state.patrolLock = true;
            minigame(false);
          }
        }
      }, 1000);
    }
    function canPatrol() {
      const e = state.game && state.game.event;
      if (!e || e.minigame || e.fight || e.ui === "commute" || e.ui === "phone") return false;
      const t = e.type;
      return t === "BOSS" || t === "COLLEAGUE" || t === "CLIENT" || t === "WORK"
        || t === "SLACK" || t === "SPECIAL" || t === "MONEY";
    }
    function startPatrol() {
      if (!canPatrol()) return;
      const app = document.getElementById("app");
      if (!app || document.getElementById("patrol")) return;
      const g = state.game;
      const debt = (g.flags && g.flags.slack_debt) || 0;
      if (debt < 3) return;
      if (g.event && g.event.id === "E30") return;
      const work = g.workApp || "IDEA";
      const names = g.event.apps || ["IDEA", "Excel", "微信", "股票", "小说"];
      const tiles = names.map(function (name) {
        const ok = name === work;
        return "<button class='app-tile' onclick='event.stopPropagation(); switchWindow(" + ok + ", false)'>" + name +

        "<div class='boss-meter'>还有 <b id='patrolDist'>4</b> 米</div>" +
        "<div class='apps'>" + tiles + "</div></div>");

      state.patrolWait = setTimeout(function () {
        const box = document.getElementById("patrol");
        if (!box) return;
        box.className = "patrol";
        let m = 4;
        state.patrolIv = setInterval(function () {
          m -= 1;
          const d = document.getElementById("patrolDist");
          const b = document.getElementById("patrolBar");
          if (d) d.textContent = String(Math.max(0, m));
          if (b) b.style.width = (Math.min(100, (4 - m) / 4 * 100)) + "%";
          if (m <= 0) {
            clearInterval(state.patrolIv);
            state.patrolIv = null;
            if (!state.patrolLock) switchWindow(false, false);
          }
        }, 1000);
      }, Math.max(4000, 10000 - debt * 800));
    }

    function settleVoice(played, g) {

      if (fightLose) return { tag: "动手 · 你挨了打", lead: "你被按住了。纸杯还在转。", commute: false };

      const ui = played && played.ui;
      if (ui === "commute") {
        if (id === "E60") return { tag: "回家", lead: "闸机在身后合上了。", commute: true };
        if (id === "E62") return { tag: "公司", lead: "工牌刷过去了。", commute: true };
        return { tag: "路上", lead: "这一段路已经走完了。", commute: true };
      }
      if (id === "E70") return { tag: "发薪", lead: "扣完五险一金，就是这些。", commute: false };

      if (id === "E29") return { tag: "打坐", lead: "眼睛睁开。工位还在。", commute: false };
      if (id === "E42" && flags().atOffice) return { tag: "股票", lead: "K 线先放到一边。", commute: false };

        return { tag: "晚上", lead: "今天到这里。", commute: false };

      return shell(
        "<div class='tag'>" + tag + "</div>" +

      return shell(
        "<div class='share msg'>" + body + "</div>" +
        (g.canRevive ? "<button class='btn' onclick='watchAd(\"REVIVE\")'>看广告复活</button>" : "") +
        "<button class='btn ghost' onclick='watchAd(\"REWARD\")'>金币 " + g.coins + "，看广告 ×2</button>" +
        "<button class='btn' onclick='req(\"/api/track\",\"POST\",{event:\"share_click\",gameId:state.game.gameId}); alert(\"" + hook + "\");'>分享给朋友</button>" +
        "<button class='btn ghost' onclick='req(\"/api/track\",\"POST\",{event:\"game_restart\"}); go(\"career\")'>再来一局</button>"
      );
    }
    async function rank() {
      const data = state.tab === "wealth" ? await req("/api/rank/wealth") : await req("/api/rank/survive");
      return shell(
        "<button class='back' onclick='go(\"home\")'>← 关闭</button>" +
        "<div class='title' style='font-size:18px'>排行榜</div>" +
        "<div class='tabs'><button class='" + (state.tab === "survive" ? "on" : "") + "' onclick='state.tab=\"survive\"; go(\"rank\")'>生存榜</button>" +
        "<button class='" + (state.tab === "wealth" ? "on" : "") + "' onclick='state.tab=\"wealth\"; go(\"rank\")'>财富榜</button></div>" +
        "<table>" + (data.map(function (r) {
          return "<tr><td>TOP " + r.rank + "</td><td>" + r.userId + "</td><td>" + (state.tab === "wealth" ? "¥" + fmt(r.money) : "第" + r.day + "天") + "</td></tr>";
        }).join("") || "<tr><td>还没有人活下来</td></tr>") + "</table>"
      );
    }
    async function book() {
      const meta = await req("/api/meta");
      return shell(
        "<button class='back' onclick='go(\"home\")'>← 关闭</button>" +
        "<div class='title' style='font-size:18px'>图鉴</div>" +
        meta.skills.map(function (s) { return "<div class='folder'><b>" + s.name + "</b><div class='muted'>" + s.desc + "</div></div>"; }).join("") +
        meta.endings.map(function (s) { return "<div class='folder'><b>" + s.name + "</b><div class='muted'>" + (s.lines || []).join(" ") + "</div></div>"; }).join("")
      );
    }
    function settings() {
      return shell(
        "<button class='back' onclick='go(\"home\")'>← 关闭</button>" +
        "<div class='title' style='font-size:18px'>设置</div>" +
        "<div class='muted' style='margin-bottom:8px'>API 地址</div>" +
        "<input id='api' value='" + state.api + "' placeholder='http://192.168.1.8:8080' />" +
        "<button class='btn' onclick='state.api=document.getElementById(\"api\").value.replace(/\\/$/,\"\"); localStorage.setItem(\"dg_api\", state.api); go(\"home\")'>保存</button>"
      );
    }

    async function render() {
      const app = document.getElementById("app");
      try {
        if (state.scene === "home") app.innerHTML = home();
        else if (state.scene === "career") app.innerHTML = await career();
        else if (state.scene === "play") app.innerHTML = play();
        else if (state.scene === "settle") app.innerHTML = settle();
        else if (state.scene === "skill") app.innerHTML = skill();
        else if (state.scene === "boss") app.innerHTML = boss();
        else if (state.scene === "fight") app.innerHTML = fight();
        else if (state.scene === "asset") app.innerHTML = asset();
        else if (state.scene === "chat") app.innerHTML = chat();
        else if (state.scene === "ending") app.innerHTML = ending();
        else if (state.scene === "rank") app.innerHTML = await rank();
        else if (state.scene === "book") app.innerHTML = await book();
        else if (state.scene === "settings") app.innerHTML = settings();
        bindCam();
        if (document.getElementById("spoken")) typeLine();
        if (state.scene === "fight") startFightClock();
        if (state.scene === "boss") startBossClock();
        if (state.scene === "play") startPatrol();
        if (state.scene === "chat") scrollChat();
        const dockHtml = dock();
        if (dockHtml) app.insertAdjacentHTML("beforeend", dockHtml);
        if (state.toast) {
          app.insertAdjacentHTML("beforeend", "<div class='toast'>" + state.toast + "</div>");
          state.toast = "";
        }
      } catch (e) {
        app.innerHTML = "<div class='fp'><div class='lcd' style='position:relative;margin:40px;padding:20px'>请求失败：" + e.message + "<br/><button class='btn' onclick='go(\"home\")'>回工位</button></div></div>";
      }
    }
    render();
  </script>
</body>
</html>
