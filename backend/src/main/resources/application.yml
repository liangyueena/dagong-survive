server:
  port: 8080

spring:
  application:
    name: dagong-survive
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/dagong;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 2000ms

app:
  store: memory
  events-per-run: 20
  skill-every: 2
  day-min: 20
  day-max: 50
  start-age: 23
  rich-money: 150000
  exec-ability: 80
  exec-boss: 70
  exec-mind: 50
  oil-slack: 80
  oil-mind: 80
  oil-boss: 30
  qwen-api-key: sk-8e29c9af34b24a128c90827a03ef83aa
  qwen-model: qwen-turbo
  qwen-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions

logging:
  level:
    com.dagong.survive: INFO
