version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: dagong_survive
      MYSQL_USER: dagong
      MYSQL_PASSWORD: dagong
      MYSQL_ROOT_PASSWORD: dagong
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7
    ports:
      - "6379:6379"
